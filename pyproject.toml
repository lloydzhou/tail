[project]
name = "tail"
version = "3.0.0"
description = "Tail —— 在 LLM SDK 与上游推理服务之间插入的文本去重传输层。把重复上下文换成块引用，显著压缩公网上行体积。"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "lloydzhou" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
tail-gateway = "tail.serve:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tail", "tail.transport"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
